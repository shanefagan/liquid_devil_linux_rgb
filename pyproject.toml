[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "liquid-devil-rgb"
dynamic = ["version"]
description = "Linux I2C RGB Lighting Control for PowerColor Radeon RX 7900 XTX Liquid Devil"
readme = "README.md"
authors = [
    { name = "Shane Fagan", email = "shane@performativenonsense.com" }
]
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
keywords = ["gpu", "rgb", "powercolor", "liquid-devil", "rx7900xtx", "i2c", "linux"]
dependencies = [
    "click>=8.0.0",
    "smbus2>=0.4.0",
]

[project.scripts]
liquid-devil-rgb = "liquid_devil_rgb.cli:main"

[tool.hatch.version]
source = "vcs"
fallback-version = "1.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/liquid_devil_rgb"]
