name: Build and Release Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Astral uv & Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Build Python Wheel and Source Distribution
        run: |
          uv build

      - name: Build Debian (.deb) Package
        run: |
          python3 packaging/build_deb.py

      - name: Build RPM (.rpm) Package
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "1.0.0")

          mkdir -p build_rpm/usr/bin build_rpm/usr/lib/python3/site-packages/liquid_devil_rgb build_rpm/usr/lib/systemd/system build_rpm/usr/share/doc/liquid-devil-rgb build_rpm/usr/share/licenses/liquid-devil-rgb
          cp -r src/liquid_devil_rgb/* build_rpm/usr/lib/python3/site-packages/liquid_devil_rgb/
          cp systemd/liquid-devil-sync.service build_rpm/usr/lib/systemd/system/
          cp README.md PROTOCOL.md build_rpm/usr/share/doc/liquid-devil-rgb/
          cp LICENSE build_rpm/usr/share/licenses/liquid-devil-rgb/

          cat << 'EOF' > build_rpm/usr/bin/liquid-devil-rgb
          #!/usr/bin/env python3
          from liquid_devil_rgb.cli import main
          if __name__ == '__main__':
              main()
          EOF
          chmod +x build_rpm/usr/bin/liquid-devil-rgb

          cat << EOF > liquid-devil-rgb.spec
          Name:           liquid-devil-rgb
          Version:        ${VERSION}
          Release:        1
          Summary:        Linux I2C RGB Lighting Control for PowerColor Radeon RX 7900 XTX Liquid Devil
          License:        MIT
          URL:            https://github.com/shanefagan/liquid_devil_linux_rgb
          BuildArch:      noarch
          Requires:       python3
          Requires:       python3-click
          Requires:       i2c-tools

          %description
          Reverse-engineered hardware protocol implementation for the PowerColor Radeon RX
          7900 XTX Liquid Devil V2 I2C RGB microcontroller (0x22). Includes OpenRGB SDK
          sync client for real-time PC lighting mirroring at 30 FPS.

          %files
          %license /usr/share/licenses/liquid-devil-rgb/LICENSE
          %doc /usr/share/doc/liquid-devil-rgb/README.md
          %doc /usr/share/doc/liquid-devil-rgb/PROTOCOL.md
          /usr/bin/liquid-devil-rgb
          /usr/lib/python3/site-packages/liquid_devil_rgb/
          /usr/lib/systemd/system/liquid-devil-sync.service
          EOF

          mkdir -p ~/rpmbuild/SPECS
          cp liquid-devil-rgb.spec ~/rpmbuild/SPECS/
          rpmbuild -bb --buildroot $(pwd)/build_rpm ~/rpmbuild/SPECS/liquid-devil-rgb.spec
          cp ~/rpmbuild/RPMS/noarch/*.rpm dist/

      - name: Build Arch Linux (.pkg.tar.zst) Package
        run: |
          sudo apt-get update && sudo apt-get install -y libarchive-tools zstd
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "1.0.0")

          mkdir -p build_arch/usr/bin build_arch/usr/lib/systemd/system build_arch/usr/share/doc/liquid-devil-rgb build_arch/usr/share/licenses/liquid-devil-rgb
          
          # Copy site-packages for Python 3.14, 3.13, 3.12, 3.11, and generic python3
          for pyver in 3.14 3.13 3.12 3.11 3; do
            mkdir -p "build_arch/usr/lib/python${pyver}/site-packages"
            cp -r src/liquid_devil_rgb "build_arch/usr/lib/python${pyver}/site-packages/"
          done

          # Systemd unit file & docs
          cp systemd/liquid-devil-sync.service build_arch/usr/lib/systemd/system/
          cp README.md PROTOCOL.md build_arch/usr/share/doc/liquid-devil-rgb/
          cp LICENSE build_arch/usr/share/licenses/liquid-devil-rgb/

          cat << 'EOF' > build_arch/usr/bin/liquid-devil-rgb
          #!/usr/bin/env python3
          from liquid_devil_rgb.cli import main
          if __name__ == '__main__':
              main()
          EOF
          chmod +x build_arch/usr/bin/liquid-devil-rgb

          cat << EOF > build_arch/.PKGINFO
          pkgname = liquid-devil-rgb
          pkgver = ${VERSION}-1
          pkgdesc = Linux I2C RGB Lighting Control for PowerColor Radeon RX 7900 XTX Liquid Devil
          url = https://github.com/shanefagan/liquid_devil_linux_rgb
          builddate = $(date +%s)
          packager = Shane Fagan <shane@performativenonsense.com>
          size = 45000
          arch = any
          license = MIT
          depend = python
          depend = python-click
          depend = i2c-tools
          EOF

          cd build_arch
          bsdtar -czf .MTREE --format=mtree --options='!all,use-set,type,uid,gid,mode,time,size,md5,sha256,link' .PKGINFO usr
          bsdtar -c --zstd -f "../dist/liquid-devil-rgb-${VERSION}-1-any.pkg.tar.zst" .PKGINFO .MTREE usr

      - name: Display Built Artifacts
        run: |
          ls -la dist/

      - name: Create GitHub Release and Upload Packages
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
